name: Multi-Platform PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Definition of the operating system matrix
    strategy:
      fail-fast: false # Allows other operating systems to continue running even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # OS-based conditional installation
    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsfml-dev libomp-dev

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: vcpkg install sfml:x64-windows

    # CMake Configuration (with a Windows-specific toolchain/vcpkg)
    - name: Configure CMake
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release
        else
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release
