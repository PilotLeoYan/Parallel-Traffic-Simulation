name: Multi-Platform PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache vcpkg packages
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      with:
        path: |
          build/vcpkg_installed
          C:\vcpkg\downloads
          ~\AppData\Local\vcpkg\archives
        # La clave cambia automáticamente si se modifica vcpkg.json
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
        # Si no hay coincidencia exacta, usa el caché más reciente disponible
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libsfml-dev libomp-dev

    - name: Configure CMake
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release
        else
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release
